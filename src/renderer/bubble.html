<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; font-src 'self' file: data:; img-src 'self' file:; media-src blob: mediastream:; object-src 'none'; base-uri 'none'" />
  <title>Screenova · cámara</title>
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="bubble.css" />
</head>
<body>
  <div class="bubble" id="bubble">
    <video id="video" autoplay muted playsinline></video>
    <div class="placeholder"><img src="../../assets/isotipo.svg" alt="" /></div>
    <div class="error" id="error">Cámara no disponible</div>
  </div>
  <div class="sizes" role="group" aria-label="Tamaño de la burbuja">
    <button type="button" data-size="s" aria-label="Pequeña">S</button>
    <button type="button" data-size="m" aria-label="Mediana">M</button>
    <button type="button" data-size="l" aria-label="Grande">L</button>
  </div>
  <script src="bubble.js"></script>
</body>
</html>
