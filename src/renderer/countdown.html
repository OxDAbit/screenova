<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file: data:" />
  <title>Screenova · cuenta atrás</title>
  <link rel="stylesheet" href="brand.css" />
  <style>
    html,
    body {
      background: transparent;
      overflow: hidden;
    }

    .dial {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: rgba(15, 39, 71, 0.88);
      backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .track {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
    }

    .sweep {
      fill: none;
      stroke: var(--butter);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 339.3;
      stroke-dashoffset: 339.3;
    }

    .sweep.run {
      animation: sweep 1s linear forwards;
    }

    .num {
      font-weight: 800;
      font-size: 110px;
      line-height: 1;
      color: var(--cream);
    }

    .num.pop {
      animation: pop 1s ease-out;
    }

    .label {
      position: absolute;
      bottom: 46px;
    }

    @keyframes sweep {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1.25);
        opacity: 0;
      }
      25% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="dial">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54" />
      <circle class="sweep" id="sweep" cx="60" cy="60" r="54" />
    </svg>
    <div class="num" id="num"></div>
    <div class="label mono">Preparando</div>
  </div>
  <script src="countdown.js"></script>
</body>
</html>
