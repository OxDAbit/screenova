<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file: data:" />
  <title>Screenova · controles</title>
  <link rel="stylesheet" href="brand.css" />
  <style>
    html,
    body {
      background: transparent;
      overflow: hidden;
    }

    .bar {
      position: absolute;
      inset: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 10px;
      border-radius: 999px;
      background: rgba(15, 39, 71, 0.94);
      border: 1px solid var(--line-strong);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      -webkit-app-region: drag;
    }

    .grip {
      width: 18px;
      align-self: stretch;
      display: grid;
      place-items: center;
      color: var(--mist);
    }

    .grip svg {
      width: 8px;
      height: 16px;
      fill: currentColor;
    }

    .time {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 96px;
      font-family: var(--font-mono);
      font-size: 15px;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .recording .rec-dot {
      animation: blink 1.4s ease-in-out infinite;
    }

    .paused .rec-dot {
      background: var(--amber);
    }

    .countdown .rec-dot,
    .saving .rec-dot {
      background: var(--mist);
    }

    .spacer {
      flex: 1;
    }

    .ctl {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      color: var(--cream);
      -webkit-app-region: no-drag;
      transition: background 0.15s;
    }

    .ctl:hover:not(:disabled) {
      background: rgba(234, 241, 251, 0.1);
    }

    .ctl.stop {
      width: 44px;
      height: 44px;
      background: var(--butter);
      color: var(--navy-ink);
      margin-left: 4px;
    }

    .ctl.stop:hover:not(:disabled) {
      background: #f8edc2;
    }

    .ctl.stop span {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: var(--rec);
    }

    .divider {
      width: 1px;
      height: 24px;
      background: var(--line-strong);
      margin: 0 2px;
    }

    @keyframes blink {
      50% {
        opacity: 0.25;
      }
    }
  </style>
</head>
<body>
  <div class="bar countdown" id="bar">
    <div class="grip" aria-hidden="true">
      <svg viewBox="0 0 8 16"><circle cx="2" cy="3" r="1.3" /><circle cx="6" cy="3" r="1.3" /><circle cx="2" cy="8" r="1.3" /><circle cx="6" cy="8" r="1.3" /><circle cx="2" cy="13" r="1.3" /><circle cx="6" cy="13" r="1.3" /></svg>
    </div>
    <div class="time"><span class="rec-dot"></span><span id="time">00:00</span></div>
    <div class="spacer"></div>
    <button class="ctl" id="pause" type="button" title="Pausar (⌥⇧P)" aria-label="Pausar">
      <svg class="icon" id="pause-icon" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" /></svg>
    </button>
    <button class="ctl" id="restart" type="button" title="Volver a empezar" aria-label="Volver a empezar">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
    </button>
    <button class="ctl" id="cancel" type="button" title="Descartar grabación" aria-label="Descartar grabación">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>
    </button>
    <div class="divider"></div>
    <button class="ctl stop" id="stop" type="button" title="Detener y guardar (⌥⇧R)" aria-label="Detener y guardar"><span></span></button>
  </div>
  <script src="controls.js"></script>
</body>
</html>
